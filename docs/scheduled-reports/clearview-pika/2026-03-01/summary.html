<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Accessibility Summary</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
<style>
body { font-family: sans-serif; padding: 2rem; }
table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
th { background: #f4f4f4; }
canvas { max-width: 900px; margin: 2rem auto; display: block; }
</style>
</head>
<body>

<h1>Accessibility Audit Summary</h1>
<h2>Site URL: https://pika.clearviewlibrary.org/</h2>

<canvas id="summaryChart"></canvas>

<table id="summary-table">
<thead>
<tr>
<th>Page</th>
<th>Title</th>
<th>Report</th>
<th>Total Violations</th>
<th>Passes</th>
<th>Critical</th>
<th>Serious</th>
<th>Moderate</th>
<th>Minor</th>
<th>Severity Score</th>
</tr>
</thead>
<tbody>

<tr>
<td>1</td>
<td><a href="https://pika.clearviewlibrary.org" target="_blank">Just a moment...</a></td>
<td><a href="./reports/1.html" target="_blank">View Report</a></td>
<td>1</td>
<td>25</td>
<td>1</td>
<td>0</td>
<td>0</td>
<td>0</td>
<td><strong>4</strong></td>
</tr>

</tbody>
</table>

<script>
const chartData = {
  labels: ["1"],
  datasets: [
    { label: 'Critical', backgroundColor: '#e3342f', data: [1] },
    { label: 'Serious', backgroundColor: '#f6993f', data: [0] },
    { label: 'Moderate', backgroundColor: '#ffed4a', data: [0] },
    { label: 'Minor', backgroundColor: '#38c172', data: [0] }
  ]
};

new Chart(document.getElementById('summaryChart'), {
  type: 'bar',
  data: chartData,
  options: {
    responsive: true,
    scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
  }
});

$(document).ready(function() {
  $('#summary-table').DataTable({ paging: false });
});
</script>

</body>
</html>
